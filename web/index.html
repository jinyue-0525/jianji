    <symbol id="i-circleCheck" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m7.5 12 3 3 6-6"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7V5.5Q3 4 4.5 4H9l2 3h8.5Q21 7 21 8.5v10q0 1.5-1.5 1.5h-15Q3 20 3 18.5Z"/></symbol>

    <symbol id="i-share" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="5" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m7.6 10.6 7.8-4.2m-7.8 7 7.8 4.2"/></symbol>

  <main class="wrapper">
    <p class="preview-label">简记 · 安卓界面交互预览<br><span>网页实现 · 非 APK · 浏览器数据与 Android 应用独立</span></p>
    <section class="phone" id="phone" aria-label="简记应用交互预览">
      <div class="statusbar" aria-hidden="true"><span>10:46</span><span class="system-icons"><svg><use href="#i-signal"/></svg><svg><use href="#i-wifi"/></svg><span class="battery"></span></span></div>
      <section class="screen" id="listScreen" aria-label="全部笔记">
        <header class="topbar" id="normalHeader"><button class="category" id="categoryButton" aria-label="全部笔记，选择分类"><span id="categoryLabel">全部笔记</span><svg aria-hidden="true"><use href="#i-chevron"/></svg></button><span class="note-count" id="noteCount">3 条</span><button class="icon-button more" id="listMore" aria-label="更多选项" aria-expanded="false"><svg aria-hidden="true"><use href="#i-more"/></svg></button></header>
        <header class="topbar selection-header" id="selectionHeader" hidden><button class="selection-action" id="selectionCancel">取消</button><span class="selection-count" id="selectionCount" aria-live="polite">已选 0</span><button class="selection-action" id="selectAll">全选</button></header>
        <div class="search-wrap"><svg aria-hidden="true"><use href="#i-search"/></svg><input id="search" type="search" placeholder="搜索笔记" aria-label="搜索笔记" autocomplete="off"><button class="icon-button search-clear" id="clearSearch" aria-label="清空搜索" hidden><svg aria-hidden="true"><use href="#i-close"/></svg></button></div>
        <div class="list" id="noteList"></div><div class="selection-bar" id="selectionBar" hidden><button class="selection-delete" id="deleteSelected" disabled>删除 (0)</button></div><button class="new-note" id="newNote" aria-label="新建笔记" title="写笔记"><svg aria-hidden="true"><use href="#i-edit"/></svg></button>
      </section>
      <section class="screen" id="editorScreen" aria-label="编辑笔记" hidden>
        <header class="editor-toolbar"><button class="icon-button" id="back" aria-label="返回笔记"><svg aria-hidden="true"><use href="#i-back"/></svg></button><div class="editor-title-group"><span class="editor-heading">笔记</span><span class="save-status" id="saveStatus" aria-live="polite">已保存</span></div><button class="icon-button" id="undo" aria-label="撤销" disabled><svg aria-hidden="true"><use href="#i-undo"/></svg></button><button class="icon-button" id="redo" aria-label="重做" disabled><svg aria-hidden="true"><use href="#i-redo"/></svg></button><button class="icon-button" id="save" aria-label="保存笔记"><svg aria-hidden="true"><use href="#i-check"/></svg></button><button class="icon-button" id="editorMore" aria-label="更多笔记操作" aria-expanded="false"><svg aria-hidden="true"><use href="#i-more"/></svg></button></header>
        <div class="metadata"><div class="date-row"><span class="editor-date" id="editorDate">10月16日 10:46</span><span class="word-count" id="wordCount" aria-label="正文 0 字，不含空格和换行">0 字</span></div><button class="folder-button" id="folderButton" aria-label="笔记当前位置：未分类"><span class="folder-chip">未分类</span></button></div>
        <div class="body-wrap"><textarea class="note-body" id="body" placeholder="写下此刻的想法…" aria-label="笔记正文" spellcheck="false"></textarea><div id="imageList" class="image-list"></div></div><input type="file" id="imagePicker" accept="image/*" hidden>
        <footer class="editor-bottom"><button class="image-button" id="imageButton"><svg aria-hidden="true"><use href="#i-image"/></svg><span>图片</span></button></footer>
      </section>
      <div class="home-indicator" aria-hidden="true"></div>
      <div class="popup" id="menu" role="menu" hidden></div>
      <div class="modal-layer" id="fontModal" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="fontTitle"><h2 id="fontTitle">字体大小</h2><fieldset class="font-options"><legend class="sr-only">选择应用内字体大小</legend><label class="font-option"><input type="radio" name="fontSize" value="system"><span>跟随系统</span></label><label class="font-option"><input type="radio" name="fontSize" value="small"><span>小 · 85%</span></label><label class="font-option"><input type="radio" name="fontSize" value="normal"><span>标准 · 100%</span></label><label class="font-option"><input type="radio" name="fontSize" value="large"><span>大 · 115%</span></label><label class="font-option"><input type="radio" name="fontSize" value="extra"><span>特大 · 130%</span></label></fieldset><div class="sample"><p class="sample-label">仅调整简记内的文字大小</p><p class="sample-text" id="fontSample">记录此刻，留住灵感。<br>每一个想法，都值得被记下。</p></div><div class="dialog-actions"><button class="dialog-action cancel" id="fontCancel">取消</button><button class="dialog-action" id="fontApply">应用</button></div></section></div>
      <div class="modal-layer" id="infoModal" hidden><section class="dialog simple-dialog" role="dialog" aria-modal="true" aria-labelledby="infoTitle"><h2 id="infoTitle">简记</h2><div id="infoContent"></div><div class="dialog-actions" id="infoActions"></div></section></div>
      <div class="modal-layer sheet-layer" id="categoryModal" hidden><section class="category-sheet" role="dialog" aria-modal="true" aria-labelledby="categoryTitle"><header class="sheet-heading"><h2 id="categoryTitle">笔记本</h2><button class="icon-button" id="categoryClose" aria-label="关闭分类"><svg aria-hidden="true"><use href="#i-close"/></svg></button></header><div class="sheet-content" id="categoryContent"></div></section></div>
      <div class="modal-layer" id="nameModal" hidden><form class="dialog" id="nameForm" role="dialog" aria-modal="true" aria-labelledby="nameTitle"><h2 id="nameTitle">新建文件夹</h2><label class="name-field-label" id="nameLabel" for="categoryName">文件夹名称</label><input class="name-field" id="categoryName" type="text" maxlength="24" placeholder="输入名称" autocomplete="off" aria-describedby="nameError"><p class="name-error" id="nameError" role="alert" hidden>请输入名称</p><div class="dialog-actions"><button class="dialog-action cancel" id="nameCancel" type="button">取消</button><button class="dialog-action" type="submit">保存</button></div></form></div>
      <div class="toast" id="toast" role="status" hidden></div>
    </section>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
